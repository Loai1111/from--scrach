<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Lifeline</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img src="https://i.ibb.co/gDFD4Q6/logo.png" alt="Lifeline Logo" class="logo">
                <h2>Admin Portal</h2>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your admin email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p id="error-message" class="error-message"></p>
            <p class="user-login-link" style="text-align: center; margin-top: 1rem;"><a href="login.html">User Login</a></p>
        </div>
    </div>
    <script type="module" src="../scripts/admin-login.js"></script>
</body>
</html>
