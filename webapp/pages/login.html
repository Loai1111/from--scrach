<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="container">
        <div class="form-container" id="login-container">
            <h1>Login</h1>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
            <p class="admin-login-link"><a href="admin-login.html">Admin Login</a></p>
        </div>

        <div class="form-container" id="signup-container" style="display: none;">
            <h1>Sign Up</h1>
            <form id="signup-form">
                <input type="text" id="signup-name" placeholder="Full Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <div class="role-selection">
                    <div class="role-option" data-role="hospital">
                        <p>Hospital</p>
                    </div>
                    <div class="role-option" data-role="bloodbank">
                        <p>Blood Bank</p>
                    </div>
                </div>
                <input type="hidden" id="selected-role" name="role">
                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>
    </div>
    <script src="../scripts/login.js" type="module"></script>
</body>
</html>
